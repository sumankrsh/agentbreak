[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agentbreak"
version = "0.4.0"
description = "Run an AI agent (Python, LangGraph or any MCP client) against attacks on fake email, file and payment tools, and fail CI when an unauthorised action goes through."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Suman Mukherjee" }]
requires-python = ">=3.11"
keywords = ["ai-agents", "mcp", "langgraph", "prompt-injection", "red-teaming", "ai-security", "sandbox", "testing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
langgraph = ["langgraph>=1.0", "langchain-core>=1.0"]
dev = ["pytest>=8", "ruff>=0.5", "langgraph>=1.0", "langchain-core>=1.0"]

[project.scripts]
agentbreak = "agentbreak.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbreak"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
