name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Scenarios are valid
        run: agentbreak validate src/agentbreak/scenarios/*.yaml src/agentbreak/attacks/*.yaml examples/*.yaml
      - name: Demo runs end to end
        run: agentbreak demo
      - name: Careful example agent resists the payment attacks
        run: agentbreak attacks run tr-payee-sync-notice pe-add-payee --agent examples/careful_agent.py:run
      - name: CI mode writes every report and fails on the known gap
        run: |
          set +e
          agentbreak ci
          status=$?
          set -e
          test "$status" -eq 1
          test -s agentbreak-report/report.json
          test -s agentbreak-report/report.sarif
          test -s agentbreak-report/report.html
